repos:
- repo: https://github.com/psf/black/
  rev: 25.11.0
  hooks:
  - id: black
- repo: https://github.com/PyCQA/flake8
  rev: 7.3.0
  hooks:
  - id: flake8
    additional_dependencies: 
    - pep8-naming
    - flake8-tidy-imports
    args: ["--config=utilities/setup.cfg", "--verbose"]

- repo: https://github.com/pylint-dev/pylint
  rev: v4.0.4
  hooks:
  - id: pylint
    args: ["--rcfile=utilities/setup.cfg"]
    exclude: ^steps/
- repo: https://github.com/pylint-dev/pylint
  rev: v4.0.4
  hooks:
  - id: pylint
    args: 
    - "--disable=C0114,C0116"
    files: ^steps/   
